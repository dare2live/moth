kind: moth_major_upgrade_ledger
schema_version: 1
authority:
  plan: Moth_Next_大版本升级方案.md
  operating_rules: AGENTS.md
  repository: .
completion_rule:
  allowed_stage_states: [NOT_STARTED, IN_PROGRESS, PARTIAL, COMPLETE, BLOCKED]
  project_complete_when:
    - every_stage_is_COMPLETE
    - full_test_suite_passes
    - codegraph_is_fresh
    - moth_self_inspection_has_no_required_residual
    - omen_required_checks_are_compatible_and_complete
    - independent_rule10_review_is_PASS
    - worktree_is_committed_and_clean
  project_blocked_when:
    - same_external_blocker_confirmed_in_three_consecutive_goal_turns
global_gates:
  - id: public_contract_tests
    command: [python3, -m, pytest, -q]
  - id: diff_integrity
    command: [git, diff, --check]
  - id: codegraph_freshness
    command: [codegraph, status]
  - id: moth_single_entry
    command:
      - python3
      - -m
      - moth.cli
      - inspect
      - --repo
      - .
      - --profile
      - .moth/profile.yaml
      - --task-kind
      - architecture_orchestration
      - --plan-only
      - --format
      - json
stages:
  - id: stage_0
    title: 本机现状审计
    state: COMPLETE
    evidence:
      - Moth_Next_大版本升级方案.md
      - src/moth/guidance.py
      - docs/major-upgrade-ledger.yaml
      - docs/compatibility-matrix.yaml
      - docs/migration-next.md
    residual: []
  - id: stage_1
    title: 统一项目模型
    state: COMPLETE
    evidence:
      - src/moth/project_model.py
      - src/moth/architecture_model.py
      - src/moth/architecture_intent.py
      - src/moth/architecture_drift.py
      - src/moth/detectors/python_project.py
      - src/moth/detectors/registry.py
      - src/moth/detectors/platform_rules.yaml
      - src/moth/detectors/platform_rules.schema.json
      - schemas/moth.project-model.schema.json
      - schemas/moth.architecture-intent.schema.json
      - tests/test_project_model.py
      - tests/test_architecture_model.py
      - tests/test_python_project_detector.py
      - tests/test_platform_detectors.py
    residual:
      - 2026-08-14 the project model acceptance matrix is complete across all five configured
        projects; no project reports FAIL and python/technology coverage moved from one to four
      - architecture declarations landed in all five repositories the same day; every project
        now resolves DECLARED/CONFORMANT, so technology and architecture coverage is closed
  - id: stage_2
    title: Mio 与架构师协作上下文闭环
    state: COMPLETE
    evidence:
      - src/moth/guidance_registry.py
      - src/moth/decision_context.py
      - src/moth/guidance_application.py
      - src/moth/guidance_application_policy.yaml
      - src/moth/orchestration.py
      - src/moth/inspection.py
      - schemas/moth.decision-context.schema.json
      - schemas/moth.guidance-application.schema.json
      - tests/test_guidance_application.py
      - tests/test_decision_context.py
      - tests/test_cli.py
    residual: []
  - id: stage_3
    title: 最小可视化闭环
    state: COMPLETE
    evidence:
      - src/moth/visual_model.py
      - src/moth/visual_policy.yaml
      - src/moth/schemas/moth.visual-document.schema.json
      - src/moth/html_report.py
      - tests/test_visual_model.py
      - tests/test_html_report.py
      - tests/test_visual_schema.py
      - tests/test_cli.py
    residual:
      - 2026-08-14 desktop (1280x720) and mobile (375x812) browser acceptance ran against the
        live console; zero console errors, no page-level horizontal overflow, and the rail
        collapses into the intended horizontal scroll strip below the 760px breakpoint
      - mobile interaction verified end to end, where an initially off-screen rail button is
        reachable, activates, and switches the main view; project selection survives reload
      - acceptance surfaced and fixed a real presentation defect where the repository root
        python application rendered as a single dot and duplicated an existing entrypoint
  - id: stage_4
    title: 逐层架构浏览
    state: COMPLETE
    evidence:
      - .moth/architecture.yaml
      - src/moth/architecture_intent.py
      - src/moth/architecture_drift.py
      - src/moth/architecture_model.py
      - src/moth/visual_model.py
      - src/moth/visual_policy.yaml
      - src/moth/html_report.py
      - tests/test_architecture_model.py
      - tests/test_visual_model.py
    residual:
      - 2026-08-14 all five registered repositories now declare .moth/architecture.yaml and
        resolve to DECLARED/CONFORMANT with zero violations and zero unverifiable entities,
        so the architecture layer is no longer empty for any registered project
      - relations, flows and state machines are declared as empty sets on the four newly
        declared repositories, which states that the declaration claims no relation rather
        than that no relation exists; declaring unverified relations would manufacture drift
  - id: stage_5
    title: 多平台适配
    state: COMPLETE
    evidence:
      - src/moth/detectors/python_project.py
      - src/moth/detectors/apple.py
      - src/moth/detectors/web.py
      - src/moth/detectors/mini_program.py
      - src/moth/detectors/data_ai.py
      - src/moth/detectors/multi_repository.py
      - src/moth/detectors/registry.py
      - src/moth/detectors/platform_rules.yaml
      - tests/test_platform_detectors.py
    residual:
      - 2026-08-14 the detector matrix was exercised across all five registered projects;
        it surfaced and fixed two real defects (python-project only accepted pyproject.toml so
        four real Python repositories reported NOT_DETECTED; discovered notebooks that fail to
        parse were escalated to project issues, which made gaokao FAIL entirely on vendored
        third-party data under data/external)
      - platform coverage stays deliberately bounded per the plan ("不追求第一版支持所有语言和框架");
        this is a standing design property, not an open residual
      - lifehack has no root Python manifest and therefore stays NOT_DETECTED by design;
        closing that would require inventing project identity from a directory name.
        Correction made 2026-08-15 —— an earlier change in this same batch had quietly done exactly
        that one layer up, in build_project_model, so this reason was void when it was
        written. The directory-name fallback and its fabricated evidence hash are now
        removed, and a test pins that a manifest-less repository reports no project identity.
  - id: stage_6
    title: 风险关联与变化分析
    state: COMPLETE
    evidence:
      - src/moth/adapters/codegraph.py
      - src/moth/adapters/complexity.py
      - src/moth/adapters/omen.py
      - src/moth/tool_evidence.py
      - src/moth/tool_contracts/omen.yaml
      - src/moth/safe_process.py
      - src/moth/change_safety.py
      - schemas/moth.change-safety.schema.json
      - tests/test_change_safety.py
      - tests/test_visual_model.py
    residual: []
  - id: stage_7
    title: 变更安全工作流
    state: COMPLETE
    evidence:
      - .moth/change-safety.yaml
      - .moth/gates/release.yaml
      - src/moth/checks/coupling.py
      - src/moth/checks/import_cycles.py
      - src/moth/gates.py
      - src/moth/change_safety.py
      - src/moth/inspection.py
      - src/moth/cli.py
      - tests/test_change_safety.py
      - tests/test_cli.py
      - tests/test_report.py
    residual: []
  - id: stage_8
    title: 工具和上游管理
    state: COMPLETE
    evidence:
      - NOTICE.md
      - pyproject.toml
      - src/moth/tool_installations.py
      - src/moth/output_transport.py
      - plugins/moth/.codex-plugin/plugin.json
      - plugins/moth/skills/moth/SKILL.md
      - plugins/moth/skills/moth/scripts/make_activation_receipts.py
      - docs/compatibility-matrix.yaml
      - docs/migration-next.md
      - tests/test_moth_plugin_receipts.py
    residual: []
  - id: stage_9
    title: 本地 Web Console 与项目 API
    state: PARTIAL
    evidence:
      - .moth/web.yaml
      - src/moth/web_policy.yaml
      - src/moth/web_config.py
      - src/moth/web_registry.py
      - src/moth/web_service.py
      - src/moth/web_app.py
      - src/moth/web_server.py
      - src/moth/web_assets/index.html
      - src/moth/web_assets/app.css
      - src/moth/web_assets/app.js
      - start.command
      - src/moth/schemas/moth.web-console.schema.json
      - src/moth/schemas/moth.web-project-view.schema.json
      - tests/test_web_console.py
    residual:
      - 2026-08-14 the project selector was accepted live end to end across all five registered
        projects; the policy ceiling is max_projects 64, so the earlier ten-project wording
        described the target scale rather than a hard limit
      - API surface accepted with real requests, where the authenticated project list returns five
        entries, an unauthenticated request is rejected with 401, and the select endpoint
        rejects a GET with 405
      - the directory picker opens a native host dialog and therefore cannot be exercised
        headlessly; only its HTTP method guard is covered, so this item stays open and must
        be accepted by a human at the machine
