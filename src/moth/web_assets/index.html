<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Moth Web Console</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="command-bar">
    <a class="brand" href="/" aria-label="Moth Web Console 首页">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span><strong>Moth</strong><small>Web Console</small></span>
    </a>
    <div class="project-control">
      <label for="project-select">项目</label>
      <div class="project-picker">
        <select id="project-select" disabled><option>正在读取项目…</option></select>
        <button id="add-project-button" class="quiet" type="button" hidden><span aria-hidden="true">+</span> 添加项目</button>
      </div>
    </div>
    <div class="command-actions">
      <button id="refresh-button" type="button" disabled>刷新</button>
      <button id="json-button" class="quiet" type="button" disabled>API JSON</button>
    </div>
  </header>

  <section class="status-strip" aria-live="polite">
    <span id="health-badge" class="badge neutral">等待</span>
    <span id="status-summary">正在连接本地 Moth 服务。</span>
    <span id="generated-at"></span>
  </section>

  <div class="app-shell">
    <aside class="rail" aria-label="项目浏览">
      <button class="rail-home active" id="home-button" type="button">项目全景</button>
      <div class="rail-group">
        <div class="rail-mode" role="tablist" aria-label="浏览模式">
          <button id="map-mode-button" type="button" role="tab" aria-selected="true">项目地图</button>
          <button id="view-mode-button" type="button" role="tab" aria-selected="false">工作视角</button>
        </div>
        <nav id="layer-nav" aria-label="项目地图"></nav>
        <nav id="viewpoint-nav" aria-label="工作视角" hidden></nav>
      </div>
      <p class="safe-note"><strong>Safe view</strong><span>每次选择都会重新检查</span></p>
    </aside>

    <main id="main-content" tabindex="-1">
      <section id="welcome-state" class="state-panel">
        <p class="context-label">本地项目工作台</p>
        <h1>选择项目，查看它如何组成与运行。</h1>
        <p>每次打开、切换或刷新都会重新扫描当前代码与项目证据。</p>
      </section>
      <section id="content-view" hidden>
        <div class="page-heading">
          <div>
            <p id="section-kicker" class="context-label">项目全景</p>
            <h1 id="section-title"></h1>
            <p id="section-summary"></p>
          </div>
          <dl id="summary-metrics" class="metrics"></dl>
        </div>
        <div id="primary-content"></div>
      </section>
      <section id="error-state" class="state-panel error-panel" hidden role="alert">
        <p class="context-label">检查失败</p>
        <h1>这次检查没有完成。</h1>
        <p id="error-message"></p>
        <button id="retry-button" type="button">重试</button>
      </section>
    </main>
  </div>

  <dialog id="evidence-dialog" aria-labelledby="evidence-title">
    <form method="dialog"><button class="dialog-close" aria-label="关闭">关闭</button></form>
    <h2 id="evidence-title">详情</h2>
    <div id="evidence-body"></div>
  </dialog>

  <div id="loading-mask" class="loading-mask" hidden aria-live="assertive">
    <span class="loading-line" aria-hidden="true"></span>
    <span id="loading-message">正在检查项目…</span>
  </div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
