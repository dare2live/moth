schema_version: moth.architecture-policy.v1
declaration_path: .moth/architecture.yaml
limits:
  declaration_bytes: 524288
  evidence_files: 32
  evidence_bytes_each: 1048576
  entities_per_state: 500
  relations_per_state: 1000
  flows_per_state: 200
  steps_per_flow: 100
  state_machines_per_state: 200
  states_per_machine: 100
  transitions_per_machine: 300
vocabulary:
  entity_kinds:
    - application
    - runtime
    - module
    - service
    - data_store
    - external_system
    - platform
    - repository
    - capability
  relation_kinds:
    - uses_runtime
    - calls
    - reads
    - writes
    - publishes
    - subscribes
    - depends_on
    - contains
    - synchronizes
    - imports
  expectations:
    - REQUIRED
    - FORBIDDEN
  # Phase 2: import-graph-backed three-tier relation verification
  # (architecture_model._verify_relations_against_import_graph). A Python
  # `calls` relation must go through an import first (dynamic import aside),
  # so absence of an import edge actually refutes it. depends_on/writes/reads/
  # etc. can be real (DB, files, HTTP, a subprocess) without ever importing the
  # other side -- 2026-09-07 measured case: service:html-report depends_on
  # service:visual-model, and html_report.py imports zero moth modules (the
  # real caller is cli.py, and the data flow direction is reversed). Scoring
  # that NOT_OBSERVED would frame a true relation as a false one.
  refutable_relation_kinds:
    - calls
  confirmable_relation_kinds:
    - uses_runtime
    - calls
    - reads
    - writes
    - publishes
    - subscribes
    - depends_on
    - contains
    - synchronizes
