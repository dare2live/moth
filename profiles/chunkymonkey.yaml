kind: profile
name: chunkymonkey
# 这份 bundled profile 只在显式 `--profile chunkymonkey` 或 `moth profiles` 时生效。
# 真实检查走仓库自己的 .moth/profile.yaml —— loader 本地优先(loader.py:458-465)。
# 2026-09-08 与那份 repo-local 对齐: 此前它停在 2026-06-05 的形态, 声明了 12 条
# 早已不存在的证据(AGENTS.md / SESSION_HANDOFF.md / analysis/ / docs/ 整个目录 /
# data/reports/tooling 整个目录 / 三个 ~/.codex/skills/*), 于是 `--profile chunkymonkey`
# 恒为 FAIL —— 报的全是配置自己的过期, 不是那个仓库的状况。
# 更要命的是它与现实**方向相反**: 它写着 CLAUDE.md 默认忽略, 而该仓库现在把 CLAUDE.md
# 当作唯一的项目规则文件。一份说反了的 profile 比没有 profile 更坏。
repo_path: /Users/dp/Documents/M/stock/chunkymonkey
codegraph_root: .
# 缺省 = moth 内建分析器 (moth.analyzers.complexity, 进程内)。
# complexity_baseline_path 已移除: data/reports/tooling 目录本身不复存在,
# 指着它只会让每次检查都报一条无人能修的 missing baseline。
evidence_paths:
  goal: goal.md
  rules: CLAUDE.md
  sandbox: sandbox/README.md
instruction_sources:
  active:
    - CLAUDE.md
    - goal.md
    - live tooling output
  context_only:
    - chunkyctl history
  ignored_by_default: []
notes: >
  Controller-first ChunkyMonkey profile. Moth owns shared tooling state such as
  dirty worktree, CodeGraph, complexity, and evidence path discovery. Repo audit
  scripts and chunkyctl own business gates and local execution-surface checks
  such as data integrity, taxonomy/PIT, strategy promotion, and data health.
  goal.md is the compact live controller board and CLAUDE.md is the sole project
  rules file; history has no file — query it with `scripts/chunkyctl history
  --grep <term>` / `--eras` (git is the original).
